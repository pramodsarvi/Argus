# internalTrafficPolicy: Local -> each worker only talks to vLLM pods on ITS node,
# which is what keeps frames node-local and prefix cache affinity intact.
apiVersion: v1
kind: Service
metadata: {name: vllm-local, namespace: vlmpipe}
spec:
  selector: {app: vllm}
  internalTrafficPolicy: Local
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: Service
metadata: {name: vlmpipe-worker-metrics, namespace: vlmpipe, labels: {app: vlmpipe-worker}}
spec:
  selector: {app: vlmpipe-worker}
  clusterIP: None
  ports: [{name: metrics, port: 9100, targetPort: 9100}]
