[project]
name = "vlmpipe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "pillow>=10", "pyyaml>=6", "numpy>=1.26", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4.21", "temporalio>=1.7"]
results = ["confluent-kafka>=2.4", "jsonschema>=4.21", "psycopg[binary]>=3.1"]
filters = ["open_clip_torch>=2.24", "torch>=2.3"]
orchestration = ["temporalio>=1.7"]
telemetry = ["prometheus-client>=0.20", "opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
# DALI is installed separately on the GPU box (CUDA-specific wheel):
#   pip install --extra-index-url https://pypi.nvidia.com nvidia-dali-cuda120

[project.scripts]
vlmpipe-fast = "vlmpipe.fast:main"

[tool.setuptools.packages.find]
include = ["vlmpipe*", "eval*", "bench*"]
